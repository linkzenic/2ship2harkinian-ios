name: Build unsigned tvOS release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the tvOS IPA
        required: true
        default: v0.1.0-ios.2

permissions:
  contents: write

concurrency:
  group: tvos-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      TWO_SHIP_IOS_VERSION: 0.1.0
      TWO_SHIP_IOS_BUILD_NUMBER: 2

    steps:
      - uses: actions/checkout@v4

      - name: Show build tools
        run: |
          xcodebuild -version
          cmake --version

      - name: Install archive generator prerequisite
        run: brew install sdl2 glew libzip nlohmann-json tinyxml2

      - name: Generate and build unsigned Apple TV app
        run: |
          cmake -S . -B build-asset-generator -GNinja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_CROWD_CONTROL=OFF \
            -DBUILD_ARCHIVE_GENERATOR_ONLY=ON \
            -DINCLUDE_MPQ_SUPPORT=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix glew);$(brew --prefix libzip);$(brew --prefix nlohmann-json);$(brew --prefix tinyxml2)" \
            -DGLEW_ROOT="$(brew --prefix glew)"
          cmake --build build-asset-generator --target Generate2ShipOtr --parallel 2
          test -s mm/2ship.o2r
          TWO_SHIP_O2R_PATH="$GITHUB_WORKSPACE/mm/2ship.o2r" scripts/build-ios.sh --tvos-device

      - name: Package unsigned Apple TV IPA
        run: |
          scripts/package-ios-unsigned.sh \
            "build-tvos-device/mm/Release-appletvos/2Ship 2 Harkinian.app" \
            "dist/2Ship-2-Harkinian-tvOS-unsigned.ipa"

      - name: Verify public artifact
        run: |
          set -euo pipefail
          test -f dist/2Ship-2-Harkinian-tvOS-unsigned.ipa
          if unzip -l dist/2Ship-2-Harkinian-tvOS-unsigned.ipa |
              grep -E '(_CodeSignature|embedded\.mobileprovision)'; then
            echo "Signed material found in public artifact."
            exit 1
          fi
          if strings dist/2Ship-2-Harkinian-tvOS-unsigned.ipa |
              grep -E -i '(/Users/)'; then
            echo "Private build metadata found in public artifact."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 2Ship-2-Harkinian-tvOS-unsigned
          path: dist/2Ship-2-Harkinian-tvOS-unsigned.ipa
          if-no-files-found: error

      - name: Attach to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            dist/2Ship-2-Harkinian-tvOS-unsigned.ipa \
            --clobber
